<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClinReg Leaderboard</title>
<meta name="description" content="Clinical regulatory writing leaderboard.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --fg: #1c1b19;
    --muted: #6b6862;
    --rule: #e4e2dd;
    --accent: #b4491f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161513;
      --fg: #eceae5;
      --muted: #9a958c;
      --rule: #2e2c28;
      --accent: #e2895f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 1.5rem;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 34rem; width: 100%; padding: 4rem 0; }
  h1 {
    margin: 0 0 0.5rem;
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    line-height: 1.15;
    letter-spacing: -0.02em;
    font-weight: 600;
  }
  .eyebrow {
    margin: 0 0 1.75rem;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }
  p { margin: 0 0 1rem; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
  code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 0.875em;
    background: color-mix(in srgb, var(--fg) 7%, transparent);
    padding: 0.15em 0.4em;
    border-radius: 4px;
  }
  footer { font-size: 0.8125rem; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">log10</p>
  <h1>ClinReg Leaderboard</h1>
  <p>This site is live and serving from <code>site/</code>. The first generated
     leaderboard will replace this page.</p>
  <hr>
  <footer>
    <p>Publish a board with <code>make publish HTML=output.html</code>.</p>
  </footer>
</main>
</body>
</html>
